--- # Devices
- device_id: arduino1
  className: embedded.mas.bridges.jacamo.JSONWatcherDevice
  microcontroller: 
      id: arduino1
      className: Mavlink4EmbeddedMas
      serial: "/dev/ttyV1"
      baudRate: 57600       
  serialActions:
      - actionName: arming
        actuationName: MAV_CMD_COMPONENT_ARM_DISARM
      - actionName: takeoff
        actuationName: MAV_CMD_NAV_TAKEOFF
      - actionName: takeoff_cmd
        actuationName: MAV_CMD_NAV_TAKEOFF
      - actionName: set_mode
        actuationName: MAV_CMD_DO_SET_MODE
      - actionName: set_message_interval
        actuationName: MAV_CMD_SET_MESSAGE_INTERVAL
      - actionName: request_data_stream
        actuationName: REQUEST_DATA_STREAM
      - actionName: waypoint
        actuationName: MAV_CMD_NAV_WAYPOINT
      - actionName: reposition
        actuationName: MAV_CMD_DO_REPOSITION
      - actionName: rtl
        actuationName: MAV_CMD_NAV_RETURN_TO_LAUNCH
      - actionName: land
        actuationName: MAV_CMD_NAV_LAND
      # New – local setpoint
      - actionName: sp_local
        actuationName: SET_POSITION_TARGET_LOCAL_NED
      - actionName: setpoint_local
        actuationName: SETPOINT_LOCAL
      - actionName: reset_setpoint_local_reference
        actuationName: RESET_SETPOINT_LOCAL_REFERENCE
      # New – attitude target
      - actionName: attitude_target
        actuationName: SET_ATTITUDE_TARGET
      # New – actuator controls
      - actionName: actuators
        actuationName: ACTUATOR_CONTROL_TARGET
      - actionName: mission_start
        actuationName: MAV_CMD_MISSION_START
      - actionName: mission_item
        actuationName: MISSION_ITEM_INT
      - actionName: mission_clear
        actuationName: MISSION_CLEAR_ALL
      - actionName: manual_control
        actuationName: MANUAL_CONTROL
      - actionName: param_set
        actuationName: PARAM_SET
      - actionName: param_request_read
        actuationName: PARAM_REQUEST_READ
      - actionName: camera_capture
        actuationName: MAV_CMD_IMAGE_START_CAPTURE
